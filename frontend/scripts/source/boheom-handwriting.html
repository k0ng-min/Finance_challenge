<script>
const svg=document.getElementById('sv');
const revs=Array.from(svg.querySelectorAll('.rev'));
const hl=document.getElementById('hl');
const numG=document.getElementById('nums');
const hlLen=hl.getTotalLength();
const OFFS=[0,645,1417,2189,3004];
const COUNTS=[6,8,7,6,8];
// 각 획이 몇 번째 글자에 속하는지
const SYL=[]; COUNTS.forEach((n,gi)=>{ for(let i=0;i<n;i++) SYL.push(gi); });

revs.forEach((p,i)=>{
  const mi=+p.closest('mask').id.slice(1);
  const pt=p.getPointAtLength(0);
  const t=document.createElementNS('http://www.w3.org/2000/svg','text');
  t.setAttribute('class','num');
  t.setAttribute('x',pt.x+OFFS[mi]-40); t.setAttribute('y',pt.y-30);
  t.textContent=i+1; numG.appendChild(t);
});

function reset(){
  revs.forEach(p=>{
    const L=p.getTotalLength();
    p.dataset.len=L;
    p.style.transition='none';
    // 간격을 획보다 길게 잡아야 브라우저별 반올림으로 획 끝이 미리 비치지 않음
    p.style.strokeDasharray=L+' '+(L+12);
    p.style.strokeDashoffset=L;
    p.style.opacity='0';
  });
  hl.style.transition='none';
  hl.style.strokeDasharray=hlLen+' '+hlLen;
  hl.style.strokeDashoffset=hlLen;
}

function play(){
  reset(); svg.getBoundingClientRect();
  const k=1/parseFloat(document.getElementById('spd').value);
  let delay=0;
  revs.forEach((p,i)=>{
    const L=+p.dataset.len;
    const dur=(90+L*0.55)*k;
    // 획을 쓰기 시작하는 순간에만 보이게 (시작 전 잔상 원천 차단)
    p.style.transition=`stroke-dashoffset ${dur}ms ${delay}ms cubic-bezier(.2,.55,.45,1),`
                      +` opacity 1ms ${delay}ms linear`;
    p.style.opacity='1';
    p.style.strokeDashoffset='0';
    // 같은 글자 안에서는 짧게, 글자가 바뀔 땐 붓 옮기는 만큼 쉼
    delay += dur + ((i+1<revs.length && SYL[i+1]!==SYL[i]) ? 230 : 40)*k;
  });
  if(document.getElementById('useHl').checked){
    hl.style.transition=`stroke-dashoffset ${900*k}ms ${delay+300*k}ms cubic-bezier(.4,0,.2,1)`;
    hl.style.strokeDashoffset='0';
  }
}

document.getElementById('play').onclick=play;
document.getElementById('wgt').oninput=e=>svg.style.setProperty('--bold',e.target.value);
document.getElementById('showNum').onchange=e=>
  numG.querySelectorAll('.num').forEach(n=>n.classList.toggle('show',e.target.checked));
document.getElementById('useHl').onchange=e=>{ if(!e.target.checked) hl.style.strokeDashoffset=hlLen; };

reset();
window.addEventListener('load',()=>setTimeout(play,300));
</script>
</body>
</html>
