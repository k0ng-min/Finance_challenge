# Render Blueprint — 백엔드(FastAPI)와 프론트엔드(정적 사이트)를 한 번에 배포한다.
# Render 대시보드에서 "New +" → "Blueprint" → 이 저장소 선택 → 배포하면 아래 두 서비스가 만들어진다.
#
# 서로의 주소(FRONTEND_BASE_URL / VITE_API_BASE)는 배포가 끝나 실제 URL이 정해진 뒤에
# 직접 채워 넣어야 한다(아래 두 값은 일부러 비워뒀다 = sync: false, 대시보드에서 입력).
# 순서: 1) 블루프린트로 두 서비스 최초 배포 → 2) 각자 URL 확인
# (예: travel-insurance-api.onrender.com / travel-insurance-web.onrender.com)
# → 3) 아래 표의 값을 상대 서비스 URL로 채워 넣고 → 4) 두 서비스 모두 재배포(Manual Deploy).
#
# GEMINI_API_KEY, KAKAO_*, GOOGLE_* 도 비밀값이라 커밋하지 않는다 — Render 대시보드의
# travel-insurance-api 서비스 Environment 탭에서 직접 입력한다. 비워두면 그 기능만 꺼진 채
# (카카오/구글 로그인 비활성, 게스트 모드로만 동작) 나머지는 정상 동작한다.

services:
  - type: web
    name: travel-insurance-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    # --proxy-headers: Render는 리버스 프록시 뒤에서 앱을 돌린다. 이 옵션이 없으면
    # 모든 요청의 클라이언트 주소가 프록시 IP로 보여서, 요청 빈도 제한이 사용자별로
    # 나뉘지 않고 전체가 한 버킷에 묶인다(한 명이 한도를 다 쓰면 모두가 막힌다).
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips="*"
    envVars:
      # 프론트엔드 배포 URL로 채운다. 예: https://travel-insurance-web.onrender.com
      - key: FRONTEND_BASE_URL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.5-flash-lite
      # 무료 인스턴스는 15분간 요청이 없으면 잠들고, 다음 방문자가 기동을 그대로 기다린다.
      # 기동 때 도는 시드 점검은 커밋된 app.db를 그대로 싣는 배포본에서 항상 헛일이라
      # (전부 "비어 있으면 채운다"인데 이미 다 들어 있다) 그 확인 시간을 없앤다.
      # 로컬·클론 환경에서는 기본값이 켬이라 그대로 동작한다. backend/app/config.py 참고.
      - key: SEED_ON_STARTUP
        value: "0"
      - key: KAKAO_REST_API_KEY
        sync: false
      - key: KAKAO_CLIENT_SECRET
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false

  - type: web
    name: travel-insurance-web
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      # 백엔드 배포 URL로 채운다. 예: https://travel-insurance-api.onrender.com
      - key: VITE_API_BASE
        sync: false
    # 서비스워커(「현지에서」 오프라인 열람용)는 절대 캐시하지 않는다. 이 파일이 캐시되면
    # 재배포해도 브라우저가 옛 워커를 계속 써서 새 화면이 영영 안 내려간다.
    headers:
      - path: /sw.js
        name: Cache-Control
        value: no-cache, no-store, must-revalidate
      - path: /registerSW.js
        name: Cache-Control
        value: no-cache, no-store, must-revalidate
      - path: /manifest.webmanifest
        name: Cache-Control
        value: no-cache
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
