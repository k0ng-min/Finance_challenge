name: CI

# 세 사람이 각자 브랜치에서 병렬로 작업하다 보니, 각자 단위 테스트는 통과하는데 합쳤을 때
# 이음매가 깨지는 일이 실제로 있었다(백엔드가 premium_total → published_premium으로 필드명을
# 바꿨는데 프론트가 옛 이름을 계속 읽어 화면만 깨진 건). 그래서 push·PR마다 백엔드 테스트와
# 프론트 프로덕션 빌드를 함께 돌린다 — 둘 중 하나만 봐서는 그런 어긋남을 못 잡는다.
on:
  push:
  pull_request:

jobs:
  backend:
    name: 백엔드 테스트
    runs-on: ubuntu-latest
    env:
      # Gemini를 부르지 않는다. 외부 API에 매달리면 쿼터·일시장애·응답 변동 때문에 테스트가
      # 비결정적이 된다. config.py는 키의 유무로 GEMINI_ENABLED를 정하므로(별도 스위치가
      # 아니다) 키를 비우는 것이 곧 "끄기"다. 저장소 시크릿이 흘러들어와도 여기서 덮인다.
      GEMINI_API_KEY: ""
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - run: pip install -r requirements.txt
        working-directory: backend

      # E2E는 data/app.db(약관 지식베이스)를 복사해 쓴다. 저장소에 커밋돼 있으므로
      # 별도 시드 없이 돌아간다 — 없으면 해당 테스트는 skip으로 빠지고 나머지는 계속 돈다.
      - run: pytest -q
        working-directory: backend

  frontend:
    name: 프론트엔드 빌드
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
        working-directory: frontend

      # tsc -b가 함께 돌아서 타입 어긋남까지 여기서 걸린다. 앞서 프론트가 없어진 필드를
      # 읽던 문제도 이 단계에서 잡혔다.
      - run: npm run build
        working-directory: frontend
